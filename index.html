<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PCOS Coach</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" sizes="192x192">
<meta name="theme-color" content="#6E1735">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PCOS Coach">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Deep burgundy + antique gold is the deliberate brand identity, kept
       regardless of the viewer's light/dark preference (like a boutique
       spa app rather than a utility that inverts with the OS). */
    --bg: #1B0E13;
    --surface: #27141C;
    --surface-2: #321923;
    --text: #F3E6DC;
    --text-muted: #B08C92;
    --text-faint: #6E4652;
    --accent: #8E1F44;
    --accent-2: #C9A227;
    --accent-soft: #3A1420;
    --good: #8FA37A;
    --line: #3D2430;
    --alert: #C65B4E;
    --ring-bg: #341B26;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .serif { font-family: 'Fraunces', serif; }
  .app { width: 100%; max-width: 480px; padding: 22px 18px 110px; display: flex; flex-direction: column; gap: 22px; min-height: 100vh; }

  header.top { display: flex; align-items: center; justify-content: space-between; }
  header.top .brand-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  header.top .brand-mark { width: 17px; height: 17px; flex-shrink: 0; color: var(--accent-2); }
  header.top .brand-name { font-family: 'Fraunces', serif; font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-2); }
  header.top .greet { font-family: 'Fraunces', serif; font-size: 21px; font-weight: 500; }
  header.top .date { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
  header.top .gear {
    width: 38px; height: 38px; border-radius: 50%; background: var(--surface);
    border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text-muted); font-size: 16px; flex-shrink: 0;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px;
  }
  .card + .card { margin-top: 0; }
  .section-title { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .section-title .action { color: var(--accent-2); cursor: pointer; font-weight: 600; font-size: 12.5px; }

  /* rings row */
  .rings-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .ring-card { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
  .ring-card .num { font-size: 12px; font-weight: 600; }
  .ring-card .lbl { font-size: 10.5px; color: var(--text-muted); }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .col { display: flex; flex-direction: column; gap: 4px; }

  .big-num { font-family: 'Fraunces', serif; font-size: 46px; line-height: 1; font-weight: 500; font-variant-numeric: tabular-nums; cursor: pointer; }
  .unit-sm { font-size: 14px; color: var(--text-muted); }
  .delta { font-size: 13px; color: var(--text-muted); }
  .delta.up { color: var(--alert); }
  .delta.down { color: var(--good); }

  input[type="number"], input[type="text"], select, textarea {
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    font-family: 'Inter', sans-serif; font-size: 15px; padding: 10px 12px; border-radius: 10px; width: 100%;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  label.field { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--text-muted); }

  button { font-family: 'Inter', sans-serif; cursor: pointer; border: none; }
  .btn {
    background: var(--accent); color: #fff; padding: 11px 16px; border-radius: 10px;
    font-size: 14px; font-weight: 600;
  }
  .btn:disabled { background: var(--surface-2); color: var(--text-faint); }
  .btn.secondary { background: var(--surface-2); color: var(--text); }
  .btn.ghost { background: none; border: 1px solid var(--line); color: var(--text-muted); }
  .btn.danger { background: none; border: 1px solid var(--line); color: var(--alert); }
  .btn.block { width: 100%; }
  .btn.sm { padding: 7px 12px; font-size: 12.5px; border-radius: 8px; }

  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 20px;
    background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; color: var(--text);
    cursor: pointer; user-select: none;
  }
  .chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-2); font-weight: 600; }
  .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }

  .list-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .list-row:last-child { border-bottom: none; }
  .empty-note { font-size: 13.5px; color: var(--text-faint); padding: 16px 0; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }

  svg.chart { width: 100%; height: 110px; display: block; }

  /* bottom nav */
  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: center;
    background: var(--surface); border-top: 1px solid var(--line);
  }
  nav.tabs .inner { width: 100%; max-width: 480px; display: flex; }
  nav.tabs .tab {
    flex: 1; text-align: center; padding: 11px 0 calc(9px + env(safe-area-inset-bottom));
    font-size: 11px; color: var(--text-faint); border-top: 2px solid transparent; display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  nav.tabs .tab .ic { font-size: 18px; }
  nav.tabs .tab.active { color: var(--accent-2); border-top-color: var(--accent); }

  .fab {
    position: fixed; right: 20px; bottom: 78px; width: 54px; height: 54px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 26px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px rgba(0,0,0,0.18); z-index: 40;
  }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 50;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    background: var(--bg); width: 100%; max-width: 480px; border-radius: 20px 20px 0 0;
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); max-height: 86vh; overflow-y: auto;
  }
  .sheet .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .sheet .sheet-title { font-family: 'Fraunces', serif; font-size: 18px; }
  .sheet .close { color: var(--text-muted); font-size: 20px; cursor: pointer; }

  .quickadd-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .quickadd-grid .qbtn {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text);
  }
  .quickadd-grid .qbtn .ic { font-size: 22px; }

  .form-grid { display: flex; flex-direction: column; gap: 12px; }
  .form-grid.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .slider-row { display: flex; flex-direction: column; gap: 6px; }
  .slider-row .slabel { display: flex; justify-content: space-between; font-size: 13px; }
  .slider-row .slabel .val { color: var(--accent-2); font-weight: 600; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }

  .settings-section { margin-bottom: 20px; }
  .settings-section h4 { font-size: 13px; color: var(--text-muted); margin: 0 0 10px; text-transform: none; }

  .supp-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .supp-row:last-child { border-bottom: none; }
  .supp-check {
    width: 26px; height: 26px; border-radius: 8px; border: 1.5px solid var(--line); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 15px; color: transparent;
  }
  .supp-check.taken { background: var(--good); border-color: var(--good); color: #fff; }
  .supp-check.skipped { background: var(--surface-2); border-color: var(--line); color: var(--text-faint); }
  .supp-name { font-size: 14.5px; }
  .supp-meta { font-size: 12px; color: var(--text-muted); }

  .tabs-inline { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .tabs-inline .titab { padding: 7px 13px; border-radius: 20px; font-size: 12.5px; background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--line); cursor: pointer; }
  .tabs-inline .titab.active { background: var(--accent-soft); color: var(--accent-2); border-color: var(--accent); font-weight: 600; }

  .macro-bar { height: 6px; border-radius: 4px; background: var(--ring-bg); overflow: hidden; }
  .macro-bar > div { height: 100%; background: var(--accent); }

  .tg-section { border-radius: 18px; overflow: hidden; border: 1px solid var(--line); margin-bottom: 12px; background: var(--surface); }
  .tg-head { display: flex; gap: 12px; align-items: center; padding: 14px 16px; background: linear-gradient(135deg, var(--accent), #4D1028); color: #fff; cursor: pointer; }
  .tg-head.avoid { background: linear-gradient(135deg, #6B2A22, #3D1511); }
  .tg-icon { font-size: 26px; flex-shrink: 0; }
  .tg-title { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; }
  .tg-sub { font-size: 11.5px; opacity: .85; margin-top: 2px; line-height: 1.4; }
  .tg-chev { font-size: 14px; opacity: .85; }
  .tg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .tg-item { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
  .tg-item.star { background: rgba(201,162,39,0.09); }
  .tg-item.avoid { background: rgba(198,91,78,0.07); }
  .tg-emoji { font-size: 20px; flex-shrink: 0; line-height: 1.1; }
  .tg-name { font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .tg-why { font-size: 11.5px; color: var(--text-muted); line-height: 1.4; }
  .tg-group { padding: 7px 14px; background: var(--surface-2); font-size: 11px; font-weight: 700; color: var(--accent-2); text-transform: uppercase; letter-spacing: .05em; }
  .tg-idea { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .tg-prot { font-size: 11.5px; color: var(--good); font-weight: 700; margin-top: 1px; }
  .tg-tag { padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--line); }
  .tg-tag.tg-green { background: rgba(143,163,122,0.18); color: var(--good); border-color: transparent; }
  .tg-tag.tg-orange { background: rgba(201,162,39,0.16); color: var(--accent-2); border-color: transparent; }
  .tg-tag.tg-purple { background: rgba(142,31,68,0.28); color: var(--text); border-color: transparent; }
  .tg-tag.tg-blue { background: rgba(111,168,194,0.18); color: #8FC1D9; border-color: transparent; }
  .tg-note { margin-top: 4px; padding: 14px 16px; border-radius: 16px; background: linear-gradient(135deg, #4D1028, var(--accent)); color: #F3E6DC; font-size: 13px; line-height: 1.6; }
  .tg-tipcard { display: flex; gap: 12px; align-items: flex-start; }
  .tg-tip-icon { font-size: 26px; min-width: 34px; text-align: center; }
  .tg-bloat { border-left: 3px solid var(--line); }
  .tg-bloat-red { border-left-color: var(--alert); }
  .tg-bloat-green { border-left-color: var(--good); }
  .tg-bloat-blue { border-left-color: #6FA8C2; }
  .tg-bloat-purple { border-left-color: var(--accent-2); }
  .tg-bloat-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .tg-bloat-item { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
  .tg-reminder { display: flex; gap: 8px; font-size: 12.5px; color: var(--text-muted); line-height: 1.55; padding: 5px 0; }
  .tg-reminder-n { color: var(--accent-2); font-weight: 700; }
  ::selection { background: var(--accent-soft); color: var(--accent-2); }

  /* Iceberg symptom check — a purely decorative scene (literal sky/ice/ocean
     colors, not theme tokens); the symptoms themselves are plain tap chips
     below it, for reliable interaction regardless of label length or screen size. */
  .iceberg-stage { position: relative; width: 100%; border-radius: 14px; overflow: hidden; background: #EAF2F6; }
  .iceberg-stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .iceberg-canvas { border-radius: 16px; overflow: hidden; position: relative; border: 1px solid rgba(21,48,61,0.25); }
  .berg-zone { position: relative; padding: 14px; transition: filter .15s; }
  .berg-zone::before { content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .berg-zone > * { position: relative; z-index: 1; }
  .berg-label { font-size: 12px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; margin-bottom: 8px; }
  .berg-label span { font-weight: 500; font-size: 10.5px; opacity: .75; text-transform: none; letter-spacing: 0; margin-left: 6px; }
  .berg-empty { font-size: 11.5px; opacity: .6; padding: 4px 0; }

  .berg-above { background: #DCEBF4; color: #15303D; min-height: 170px; display: flex; flex-direction: column; justify-content: flex-end; }
  .berg-above::before { background: #FBFEFF; clip-path: polygon(0 100%, 12% 66%, 28% 76%, 50% 6%, 67% 50%, 81% 30%, 100% 100%); }
  .berg-above .berg-label { position: absolute; top: 10px; left: 14px; margin: 0; z-index: 2; }
  .berg-waterline { background: #8FC3DB; color: #0E3A52; min-height: 96px; box-shadow: inset 0 3px 0 rgba(255,255,255,0.6); }
  .berg-waterline::before { background: #E8F5FA; clip-path: polygon(7% 0, 93% 0, 100% 100%, 0 100%); }
  .berg-below { background: #0B3550; color: #EAF6FB; min-height: 300px; }
  .berg-below::before { background: rgba(143,196,222,0.34); clip-path: polygon(2% 0, 98% 0, 90% 34%, 74% 74%, 52% 100%, 30% 76%, 12% 36%); }
  .berg-above .chip, .berg-waterline .chip { background: rgba(255,255,255,0.9); border-color: rgba(21,48,61,0.3); color: #15303D; }
  .berg-below .chip { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.35); color: #F2FAFD; }

  .iceberg-canvas.drag-active .berg-zone { outline: 2px dashed rgba(201,162,39,0.8); outline-offset: -6px; }
  .berg-zone.drop-hover { filter: brightness(1.1); outline: 3px solid #C9A227 !important; outline-offset: -5px; }
  .berg-zone.zone-flash { animation: zoneFlash 1.1s ease-out; }
  @keyframes zoneFlash { 0% { box-shadow: inset 0 0 0 4px #C9A227, 0 0 24px rgba(201,162,39,0.7); } 100% { box-shadow: inset 0 0 0 0 rgba(201,162,39,0), 0 0 0 rgba(201,162,39,0); } }
  .chip.just-placed { animation: chipPop .45s cubic-bezier(.2,1.4,.4,1); }
  @keyframes chipPop { 0% { transform: scale(.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

  .symptom-pool-card { cursor: grab; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  .symptom-pool-card.drag-origin { opacity: .35; }
  .chip-cat { margin-left: 6px; font-size: 9.5px; opacity: .6; font-weight: 500; }
  body.is-dragging-symptom { cursor: grabbing; -webkit-user-select: none; user-select: none; }
  .iceberg-ghost { position: fixed; z-index: 400; pointer-events: none; transform: translate(-50%, -50%) scale(1.1); background: var(--accent); color: #fff; border-radius: 20px; padding: 8px 14px; font-size: 13px; font-weight: 600; box-shadow: 0 12px 26px rgba(0,0,0,0.4); white-space: nowrap; }

  .period-state { margin-top: 12px; border-top: 1px solid var(--line); }
  .period-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .period-label { color: var(--text-muted); }
  .period-value { color: var(--text-faint); }
  .period-value.done { color: var(--good); font-weight: 600; }
  .period-notice { margin-top: 10px; padding: 9px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-2); font-size: 12.5px; }
  .btn.done { background: var(--accent-soft); color: var(--accent-2); border: 1px solid var(--accent); }
  .rem-section { padding: 14px; }
  .rem-cat { font-size: 14px; font-weight: 600; }
  .rem-count, .rem-meta { font-size: 12px; color: var(--text-muted); }
  .rem-badge { font-size: 12.5px; font-weight: 600; }
  .rem-note { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; margin-top: 8px; }
  .rem-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .rem-row.rem-off .rem-main { opacity: .5; }
  .rem-main { flex: 1; cursor: pointer; }
  .rem-time { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .switch { position: relative; display: inline-block; width: 46px; height: 28px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch .slider { position: absolute; inset: 0; background: var(--ring-bg); border: 1px solid var(--line); border-radius: 28px; transition: .2s; cursor: pointer; }
  .switch .slider::before { content: ''; position: absolute; width: 22px; height: 22px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider { background: var(--accent); border-color: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(18px); }
  .diag-list { border-top: 1px solid var(--line); margin-top: 6px; }
  .diag-row { display: flex; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; line-height: 1.4; align-items: flex-start; }
  .diag-ic { width: 16px; text-align: center; font-weight: 700; flex-shrink: 0; }
  .diag-ok .diag-ic { color: var(--good); } .diag-fail .diag-ic { color: var(--alert); } .diag-warn .diag-ic { color: var(--accent-2); } .diag-info .diag-ic { color: var(--text-faint); }
  .diag-lbl { width: 112px; flex-shrink: 0; color: var(--text-muted); }
  .diag-txt { flex: 1; word-break: break-word; }
  .flash-attn { animation: attnFlash 1.6s ease-out; border-radius: 12px; }
  @keyframes attnFlash { 0% { box-shadow: 0 0 0 3px #C9A227, 0 0 22px rgba(201,162,39,.6); } 100% { box-shadow: 0 0 0 0 rgba(201,162,39,0); } }

  .iceberg-toast { border-radius: 12px; padding: 12px 14px; margin-top: 12px; animation: icebergToastIn .2s ease-out; }
  .iceberg-toast.zone-above { background: #EAF2F6; color: #15303D; }
  .iceberg-toast.zone-waterline { background: #CFE6EE; color: #0E3A52; }
  .iceberg-toast.zone-below { background: #11425C; color: #EAF2F6; }
  .iceberg-toast-head { font-size: 13.5px; margin-bottom: 3px; line-height: 1.4; }
  .iceberg-toast-sub { font-size: 11px; opacity: .75; margin-bottom: 5px; }
  .iceberg-toast-body { font-size: 12.5px; line-height: 1.5; opacity: 0.92; }
  .iceberg-toast-source { display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 600; opacity: 0.85; color: inherit; }
  @keyframes icebergToastIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
  <div class="app" id="app"></div>
  <div class="fab" id="fabBtn">+</div>
  <nav class="tabs"><div class="inner" id="bottomNav"></div></nav>
  <div id="overlays"></div>

<script>
(function () {
  // ---------------- constants ----------------
  const KG_PER_LB = 0.45359237;
  const MEALS = ['Breakfast','Lunch','Dinner','Snacks'];
  // Public VAPID key for Web Push (safe to expose client-side by design).
  const VAPID_PUBLIC_KEY = 'BCJfvw0IzaLwhdmndLrU7c990sN7wQpncUl1C2e-YwEDNznC0SWWUlq8M5LBUfBUNJ-wVh4LL8m7w6LZ8c8gmlk';
  const UNIT_OPTIONS = ['g','kg','ml','oz','cup','tbsp','tsp','piece','slice','serving'];

  // Classic "PCOS iceberg" framing: what most people notice (the visible tip)
  // vs. things that are easy to miss or go unspoken (the submerged mass).
  // This is a visual metaphor, not a medical classification — "things you may
  // notice," never "PCOS symptoms you have."
  const QUICK_SYMPTOMS = [
    { name: 'Irregular periods', zone: 'above' },
    { name: 'Acne', zone: 'above' },

    const slug = t => t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    SYMPTOM_LIBRARY_DATA.forEach(cat => {
      const rules = CATEGORY_RULES[cat.category] || { evidenceType: 'associated_experience', explanation: '' };
      cat.items.forEach(name => {
        if (SYMPTOM_BY_NAME[name]) return;
        let zone = cat.zone, evidenceType = rules.evidenceType, explanation = rules.explanation;
        if (cat.zoneOverrides) Object.keys(cat.zoneOverrides).forEach(z => { if (cat.zoneOverrides[z].indexOf(name) >= 0) zone = z; });
        (rules.overrides || []).forEach(o => {
          if (o.items.indexOf(name) >= 0) {
            if (o.evidenceType) evidenceType = o.evidenceType;
            if (o.explanation) explanation = o.explanation;
          }
        });
        const rec = { id: slug(name), name, category: cat.category, icebergPosition: zone, evidenceType, explanation, source: ICEBERG_SOURCE.name, sourceUrl: ICEBERG_SOURCE.url };
        SYMPTOMS.push(rec);
        SYMPTOM_BY_NAME[name] = rec;
      });
    });
  })();

  function classifySymptom(name, category) {
    const rec = SYMPTOM_BY_NAME[name];

    }
    // Custom symptom: borrows the zone of the category the person chose. It is not a clinical classification.
    const cat = SYMPTOM_LIBRARY_DATA.find(c => c.category === category);
    const zone = cat ? cat.zone : 'below';
    return { zone, ...ZONE_META[zone], evidenceType: 'personal_observation', explanation: 'A personal observation you chose to track. It is placed using the category you picked, not a clinical classification.', source: null, category: category || 'Custom' };

  function loadLocal() {
    let seeded = false;

      const raw = localStorage.getItem(LS_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        profile = s.profile || profile;
        goals = s.goals || goals;
        if (s.supplements && s.supplements.length) { supplements = s.supplements; }
        else { supplements = defaultSupplements(); seeded = true; }
        weightLogs = s.weightLogs || [];
        foodEntries = s.foodEntries || [];
        myFoods = s.myFoods || [];
        waterEntries = s.waterEntries || [];
        supplementLogs = s.supplementLogs || [];
        const cm = migrateCycleEntries(s.cycleEntries || []);
        cycleEntries = cm.records;
        if (cm.changed) seeded = true;
        symptomLogs = s.symptomLogs || [];
        customSymptomDefs = s.customSymptomDefs || [];
        healthMeasurements = s.healthMeasurements || [];
        if (Array.isArray(s.reminders)) reminders = s.reminders.map(normalizeReminder);
        else { reminders = buildLegacyReminders(); if (reminders.length) seeded = true; }
      } else {
        supplements = defaultSupplements();
        seeded = true;
      }
    } catch (e) {}
    if (seeded) saveLocal();
    render();
  }

  // ---------------- derived data ----------------
  function todayFoodEntries() { return foodEntries.filter(e => e.date === todayStr()); }
  function todayTotals() {
    const t = { calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0 };
    todayFoodEntries().forEach(e => { t.calories += +e.calories||0; t.protein += +e.protein||0; t.carbs += +e.carbs||0; t.fat += +e.fat||0; t.fiber += +e.fiber||0; });

  function todayWaterMl() { return waterEntries.filter(e => e.date === todayStr()).reduce((s,e) => s + (+e.ml||0), 0); }
  function weightSortedDesc() { return [...weightLogs].sort((a,b) => a.date < b.date ? 1 : -1); }


  // ---------------- period / cycle model ----------------
  // PeriodRecord: { id, startDate, endDate, spottingDates[], createdAt, updatedAt }
  // Dates are plain 'YYYY-MM-DD' strings in the person's local calendar, so
  // they never shift across time zones.
  function fmtDate(d) {
    if (!d) return '';
    return new Date(d + 'T00:00:00').toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
  }
  function fmtDateShort(d) {
    return new Date(d + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }
  function daysBetween(a, b) {
    return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
  }
  function newPeriodRecord(p) {
    const now = new Date().toISOString();
    return { id: uid(), startDate: null, endDate: null, spottingDates: [], createdAt: now, updatedAt: now, ...p };
  }
  function normalizePeriodRecord(r) {
    const now = new Date().toISOString();
    return { id: r.id || uid(), startDate: r.startDate || null, endDate: r.endDate || null,
      spottingDates: Array.isArray(r.spottingDates) ? r.spottingDates : [], createdAt: r.createdAt || now, updatedAt: r.updatedAt || now };
  }
  // Older versions stored loose events {type: period_start|period_end|spotting, date}.
  function migrateCycleEntries(list) {
    if (!Array.isArray(list)) return { records: [], changed: false, legacyIds: [] };
    const legacy = list.filter(e => e && e.type);
    const modern = list.filter(e => e && !e.type).map(normalizePeriodRecord);
    if (!legacy.length) return { records: modern, changed: false, legacyIds: [] };
    const events = [...legacy].sort((a, b) => ((a.date || '') < (b.date || '') ? -1 : 1));
    const records = [];
    events.forEach(ev => {
      if (!ev.date) return;
      if (ev.type === 'period_start') {
        records.push(newPeriodRecord({ startDate: ev.date }));
      } else if (ev.type === 'period_end') {
        const t = [...records].reverse().find(r => r.startDate && r.startDate <= ev.date && !r.endDate);
        if (t) t.endDate = ev.date; else records.push(newPeriodRecord({ endDate: ev.date }));
      } else if (ev.type === 'spotting') {
        const t = [...records].reverse().find(r => r.startDate && r.startDate <= ev.date && daysBetween(r.startDate, ev.date) <= 14);
        if (t) { if (t.spottingDates.indexOf(ev.date) < 0) t.spottingDates.push(ev.date); }
        else records.push(newPeriodRecord({ spottingDates: [ev.date] }));
      }
    });
    return { records: [...modern, ...records], changed: true, legacyIds: legacy.map(e => e.id).filter(Boolean) };
  }
  function periodSortKey(r) {
    const sp = r.spottingDates && r.spottingDates.length ? r.spottingDates[r.spottingDates.length - 1] : '';
    return r.startDate || sp || r.endDate || (r.createdAt || '').slice(0, 10);
  }
  function sortedPeriods() { return [...cycleEntries].sort((a, b) => (periodSortKey(a) < periodSortKey(b) ? 1 : -1)); }
  function currentPeriod() { return sortedPeriods().find(r => r.startDate) || null; }
  function recentSpottingDates(n) {
    const all = [];
    cycleEntries.forEach(r => (r.spottingDates || []).forEach(d => all.push(d)));
    return all.sort().reverse().slice(0, n);
  }
  function cycleLengths() {
    const starts = cycleEntries.filter(r => r.startDate).map(r => r.startDate).sort();
    const out = [];
    for (let i = 1; i < starts.length; i++) out.push(daysBetween(starts[i - 1], starts[i]));
    return out;
  }
  function cycleDayNumber() {
    const cur = currentPeriod();
    if (!cur) return null;
    const n = daysBetween(cur.startDate, todayStr()) + 1;
    return n >= 1 ? n : null;
  }
  async function savePeriodRecord(rec) {
    rec = { ...rec, updatedAt: new Date().toISOString() };
    const idx = cycleEntries.findIndex(r => r.id === rec.id);
    if (idx >= 0) cycleEntries[idx] = rec; else cycleEntries.push(rec);
    render();
    if (localMode) { saveLocal(); return; }
    await docSave('cycleEntries', rec.id, rec);
  }
  async function deletePeriodRecord(id) {
    cycleEntries = cycleEntries.filter(r => r.id !== id);
    render();
    if (localMode) { saveLocal(); return; }
    await docDelete('cycleEntries', id);
  }
  // Each returns { message } on success or { error } so the sheet can explain.
  async function logPeriodStart(date) {
    if (cycleEntries.some(r => r.startDate === date)) return { message: 'That period start is already logged.' };
    // A start within a week of an existing, unfinished period is treated as correcting that period's start.
    const near = cycleEntries.filter(r => r.startDate && Math.abs(daysBetween(r.startDate, date)) <= 7 && !(r.endDate && date > r.endDate))
      .sort((a, b) => (a.startDate < b.startDate ? 1 : -1))[0];
    if (near) {
      await savePeriodRecord({ ...near, startDate: date });
      return { message: 'Updated your current period\u2019s start to ' + fmtDate(date) + '.' };
    }
    await savePeriodRecord(newPeriodRecord({ startDate: date }));
    return { message: 'Period start logged: ' + fmtDate(date) + '.' };
  }
  async function logPeriodEnd(date) {
    const target = cycleEntries.filter(r => r.startDate && r.startDate <= date)
      .sort((a, b) => (a.startDate < b.startDate ? 1 : -1))[0];
    if (!target) {
      if (cycleEntries.some(r => r.startDate)) return { error: 'That end date is before every period start you\u2019ve logged. Check the date, or log the start first.' };
      await savePeriodRecord(newPeriodRecord({ endDate: date }));
      return { message: 'Period end logged: ' + fmtDate(date) + ' (no start date on record for it).' };
    }
    const had = !!target.endDate;
    await savePeriodRecord({ ...target, endDate: date });
    return { message: (had ? 'Updated period end: ' : 'Period end logged: ') + fmtDate(date) + '.' };
  }
  async function logSpotting(date) {
    if (cycleEntries.some(r => (r.spottingDates || []).indexOf(date) >= 0)) return { message: 'Spotting on that date is already logged.' };
    const cand = cycleEntries.filter(r => r.startDate && r.startDate <= date && daysBetween(r.startDate, date) <= 14)
      .sort((a, b) => (a.startDate < b.startDate ? 1 : -1))[0];
    if (cand) await savePeriodRecord({ ...cand, spottingDates: [...cand.spottingDates, date].sort() });
    else await savePeriodRecord(newPeriodRecord({ spottingDates: [date] }));
    return { message: 'Spotting logged: ' + fmtDate(date) + '.' };
  }
  function showPeriodNotice(msg) {

  function rangeDates(n) {
    const arr = [];
    for (let i = n-1; i >= 0; i--) arr.push(daysAgoStr(i));

  }
  function proteinSeries(n) {
    return rangeDates(n).map(d => {
      const total = foodEntries.filter(e => e.date === d).reduce((s,e) => s + (+e.protein||0), 0);
      return { date: d, value: total };

  function waterSeries(n) {
    return rangeDates(n).map(d => {

  function weightSeries(n) {

    }).filter(p => p.value != null);
  }
  function supplementAdherence(n) {
    if (supplements.length === 0) return null;
    const dates = rangeDates(n);
    let taken = 0, total = 0;
    dates.forEach(d => supplements.forEach(s => {
      total++;
      const log = supplementLogs.find(l => l.date === d && l.suppId === s.id);
      if (log && log.status === 'taken') taken++;
    }));
    return total ? Math.round((taken/total)*100) : null;
  }

  // ---------------- small UI builders ----------------
  function ring(pct, colorVar) {
    const r = 17, c = 2*Math.PI*r;
    const p = Math.max(0, Math.min(1, pct));
    return `<svg width="42" height="42" viewBox="0 0 42 42">
      <circle cx="21" cy="21" r="${r}" fill="none" stroke="var(--ring-bg)" stroke-width="4"></circle>
      <circle cx="21" cy="21" r="${r}" fill="none" stroke="var(${colorVar||'--accent'})" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"
        transform="rotate(-90 21 21)"></circle>
    </svg>`;
  }

  function lineChart(points, opts) {
    opts = opts || {};
    if (points.length < 2) return `<div class="empty-note">Not enough data yet for this chart.</div>`;
    const w = 420, h = 100, padX = 6, padY = 12;
    const vals = points.map(p => p.value);
    const min = Math.min(...vals), max = Math.max(...vals);
    const range = (max-min) || 1;
    const stepX = (w - padX*2) / (points.length-1);
    const coords = vals.map((v,i) => [padX+i*stepX, padY + (1-(v-min)/range)*(h-padY*2)]);
    const line = coords.map((c,i) => (i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
    const area = line + ` L${coords[coords.length-1][0].toFixed(1)},${h-padY} L${coords[0][0].toFixed(1)},${h-padY} Z`;
    const last = coords[coords.length-1];
    return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <path d="${area}" fill="var(--accent)" opacity="0.08" stroke="none"></path>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="var(--accent)"></circle>
    </svg>`;
  }
  function barChart(points, target) {
    if (points.every(p => !p.value)) return `<div class="empty-note">Not enough data yet for this chart.</div>`;
    const w = 420, h = 100, gap = 3;
    const max = Math.max(target||0, ...points.map(p => p.value||0), 1);
    const bw = (w / points.length) - gap;
    const bars = points.map((p,i) => {
      const bh = Math.max(2, (p.value||0)/max * (h-10));
      const x = i*(bw+gap);
      return `<rect x="${x.toFixed(1)}" y="${(h-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="var(--accent)" opacity="0.85"></rect>`;
    }).join('');
    return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${bars}</svg>`;
  }

  function escapeHtml(s) { return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function renderWeightToday(todayW, prevW) {
    const el = document.getElementById('weightToday');
    if (!el) return;

      const current = todayW ? kgToDisplay(todayW.weightKg).toFixed(1) : '';
      el.innerHTML = `
        <div class="row">

        </div>`;

      document.getElementById('wSave').addEventListener('click', async () => {
        const v = parseFloat(document.getElementById('wInput').value);
        if (isNaN(v) || v<=0) return;
        await upsertWeight(todayStr(), displayToKg(v));

      });
      return;
    }
    const val = kgToDisplay(todayW.weightKg);
    let deltaHtml = '<div class="delta">First entry — nothing to compare yet</div>';
    if (prevW) {
      const diff = todayW.weightKg - prevW.weightKg;
      const dd = kgToDisplay(Math.abs(diff));

  function wireSymptomPoolCards(container) {
    container.querySelectorAll('.symptom-pool-card').forEach(card => {
      card.addEventListener('contextmenu', e => e.preventDefault());
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); placeSymptomOnIceberg(card.dataset.symptom, card.dataset.category, {}); }
      });
      card.addEventListener('pointerdown', e => startPoolPress(e, card));
    });
  }

  // Keep the page from scrolling once a touch drag has begun.
  document.addEventListener('touchmove', function (e) {
    if (pressState && pressState.dragging && e.cancelable) e.preventDefault();
  }, { passive: false });

  function startPoolPress(e, card) {
    if (pressState) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    pressState = { card, pointerId: e.pointerId, pointerType: e.pointerType, startX: e.clientX, startY: e.clientY, x: e.clientX, y: e.clientY, dragging: false, ghost: null, holdTimer: null };
    if (e.pointerType === 'touch') {
      // Touch-and-hold picks the card up; moving first means the person is just scrolling.
      pressState.holdTimer = setTimeout(() => { if (pressState && !pressState.dragging) beginPoolDrag(); }, 230);
    }
    document.addEventListener('pointermove', onPoolPointerMove);
    document.addEventListener('pointerup', onPoolPointerUp);
    document.addEventListener('pointercancel', onPoolPointerCancel);
  }

  function beginPoolDrag() {
    const st = pressState;
    if (!st || st.dragging) return;
    st.dragging = true;
    const ghost = document.createElement('div');
    ghost.className = 'iceberg-ghost';
    ghost.textContent = st.card.dataset.symptom;
    document.body.appendChild(ghost);
    st.ghost = ghost;
    st.card.classList.add('drag-origin');
    document.body.classList.add('is-dragging-symptom');
    const canvas = document.getElementById('icebergCanvas');
    if (canvas) canvas.classList.add('drag-active');
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (err) {}
    positionGhost();
  }

  function positionGhost() {
    const st = pressState;
    if (!st || !st.ghost) return;
    st.ghost.style.left = st.x + 'px';
    st.ghost.style.top = (st.y - (st.pointerType === 'touch' ? 34 : 0)) + 'px';
  }

  function icebergDropTarget(x, y) {
    const canvas = document.getElementById('icebergCanvas');
    if (!canvas) return null;
    const r = canvas.getBoundingClientRect();
    if (x < r.left - 4 || x > r.right + 4 || y < r.top - 4 || y > r.bottom + 4) return null;
    const aboveEl = document.getElementById(zoneElId('above'));
    let found = (aboveEl && y < aboveEl.getBoundingClientRect().top) ? 'above' : 'below';
    ['above', 'waterline', 'below'].forEach(z => {
      const zr = document.getElementById(zoneElId(z)).getBoundingClientRect();
      if (y >= zr.top && y <= zr.bottom) found = z;
    });
    return { zone: found };
  }

  function updateDropHover() {
    const st = pressState;
    if (!st) return;
    const drop = icebergDropTarget(st.x, st.y);
    ['above', 'waterline', 'below'].forEach(z => {
      const n = document.getElementById(zoneElId(z));
      if (n) n.classList.toggle('drop-hover', !!drop && drop.zone === z);
    });
  }

  function onPoolPointerMove(e) {
    const st = pressState;
    if (!st || e.pointerId !== st.pointerId) return;
    st.x = e.clientX; st.y = e.clientY;
    const dist = Math.hypot(st.x - st.startX, st.y - st.startY);
    if (!st.dragging) {
      if (st.pointerType === 'touch') { if (dist > 10) endPoolPress(); return; }
      if (dist > 5) beginPoolDrag();
    }
    if (pressState && pressState.dragging) { positionGhost(); updateDropHover(); }
  }

  function endPoolPress() {
    const st = pressState;
    if (!st) return;
    clearTimeout(st.holdTimer);
    document.removeEventListener('pointermove', onPoolPointerMove);
    document.removeEventListener('pointerup', onPoolPointerUp);
    document.removeEventListener('pointercancel', onPoolPointerCancel);
    if (st.ghost) st.ghost.remove();
    document.querySelectorAll('.drag-origin').forEach(n => n.classList.remove('drag-origin'));
    document.body.classList.remove('is-dragging-symptom');
    const canvas = document.getElementById('icebergCanvas');
    if (canvas) canvas.classList.remove('drag-active');
    document.querySelectorAll('.berg-zone.drop-hover').forEach(n => n.classList.remove('drop-hover'));
    pressState = null;
  }

  function onPoolPointerCancel(e) {
    if (pressState && e.pointerId === pressState.pointerId) endPoolPress();
  }

  function animateGhostTo(ghost, x, y, done) {
    ghost.style.transition = 'left .38s cubic-bezier(.2,.8,.2,1), top .38s cubic-bezier(.2,.8,.2,1), opacity .38s ease, transform .38s ease';
    requestAnimationFrame(() => {
      ghost.style.left = x + 'px';
      ghost.style.top = y + 'px';
      ghost.style.transform = 'translate(-50%, -50%) scale(.92)';
    });
    setTimeout(() => { ghost.remove(); if (done) done(); }, 400);
  }

  function onPoolPointerUp(e) {
    const st = pressState;
    if (!st || e.pointerId !== st.pointerId) return;
    const name = st.card.dataset.symptom, category = st.card.dataset.category;
    const moved = Math.hypot(e.clientX - st.startX, e.clientY - st.startY) > 10;
    if (!st.dragging || !moved) {            // a tap (or a hold without moving)
      endPoolPress();
      placeSymptomOnIceberg(name, category, {});
      return;
    }
    const drop = icebergDropTarget(e.clientX, e.clientY);
    const ghost = st.ghost;
    st.ghost = null;
    const originRect = st.card.getBoundingClientRect();
    endPoolPress();
    if (!ghost) return;
    if (!drop) {                              // released away from the iceberg: nothing is placed
      animateGhostTo(ghost, originRect.left + originRect.width / 2, originRect.top + originRect.height / 2, null);
      return;
    }
    const info = classifySymptom(name, category);
    const target = document.getElementById(zoneChipsId(info.zone));
    const tr = target ? target.getBoundingClientRect() : null;
    const tx = tr ? tr.left + Math.min(tr.width / 2, 120) : e.clientX;
    const ty = tr ? tr.top + Math.min(tr.height / 2, 26) : e.clientY;
    animateGhostTo(ghost, tx, ty, () => placeSymptomOnIceberg(name, category, { fromDrag: true, dropZone: drop.zone }));
  }

  async function placeSymptomOnIceberg(name, category, opts) {
    opts = opts || {};
    const info = classifySymptom(name, category);
    const wasClaimed = todaySymptomSet().has(name);
    if (wasClaimed && !opts.fromDrag) {       // tapping an already-placed card takes it back off today
      icebergToast = null;
      await toggleSymptom(name);
      return;
    }
    const wrong = !!(opts.fromDrag && opts.dropZone && opts.dropZone !== info.zone);
    icebergToast = { symptom: name, ...info, wrong };
    flashZone = info.zone;
    lastPlacedSymptom = name;
    scheduleToastHide(wrong ? 7000 : 5000);
    if (!wasClaimed) await toggleSymptom(name); else render();
  }

  function scheduleToastHide(ms) {
    clearTimeout(window.__icebergToastTimer);
    window.__icebergToastTimer = setTimeout(() => { icebergToast = null; renderIcebergToast(); }, ms);
  }
  function renderIcebergToast() {
    const el = document.getElementById('icebergToastBox');
    if (!el) return;
    if (!icebergToast) { el.innerHTML = ''; return; }
    const t = icebergToast;
    const head = t.wrong
      ? `Not quite \u2014 ${escapeHtml(t.symptom)} is classified as ${escapeHtml(t.kind)}, so we\u2019ve placed it ${escapeHtml(t.phrase)}.`
      : `<strong>${escapeHtml(t.symptom)}</strong> \u2014 ${escapeHtml(t.label)}`;
    el.innerHTML = `
      <div class="iceberg-toast zone-${t.zone}">
        <div class="iceberg-toast-head">${head}</div>
        <div class="iceberg-toast-sub">${escapeHtml(t.sub)} \u00b7 ${escapeHtml(EVIDENCE_LABELS[t.evidenceType] || '')}</div>
        <div class="iceberg-toast-body">${escapeHtml(t.explanation)}</div>
        ${t.source ? `<a href="${t.source.url}" target="_blank" rel="noopener" class="iceberg-toast-source">${escapeHtml(t.source.name)} \u2197</a>` : ''}
      </div>`;
  }

  function renderIcebergZones() {
    const entries = todaySymptomEntries();
    const byZone = { above: [], waterline: [], below: [] };
    const all = allSymptomItems();
    entries.forEach(e => {
      const match = all.find(i => i.name === e.symptom);
      byZone[classifySymptom(e.symptom, match ? match.category : null).zone].push(e);
    });
    ['above', 'waterline', 'below'].forEach(zone => {
      const el = document.getElementById(zoneChipsId(zone));
      if (!el) return;
      const list = byZone[zone];
      el.innerHTML = list.length
        ? list.map(e => `<div class="chip active ${e.symptom === lastPlacedSymptom ? 'just-placed' : ''}" data-symptom="${escapeHtml(e.symptom)}">${escapeHtml(e.symptom)}${e.intensity ? ' \u00b7 ' + e.intensity : ''}</div>`).join('')
        : `<div class="berg-empty">Nothing placed here yet</div>`;
      el.querySelectorAll('.chip').forEach(chip => chip.addEventListener('click', () => {
        overlay = { type: 'symptom-intensity', symptom: chip.dataset.symptom };
        render();
      }));
    });
    lastPlacedSymptom = null;
    if (flashZone) {
      const z = document.getElementById(zoneElId(flashZone));
      const zn = flashZone;
      flashZone = null;
      if (z) { z.classList.add('zone-flash'); setTimeout(() => { const n = document.getElementById(zoneElId(zn)); if (n) n.classList.remove('zone-flash'); }, 1100); }
    }
    const noteEl = document.getElementById('moodPatternNote');
    if (noteEl) {
      const note = moodPatternNote();
      noteEl.innerHTML = note ? `<div style="font-size:12px;color:var(--text-muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--line);line-height:1.5;">${escapeHtml(note)}</div>` : '';
    }
    renderIcebergToast();
  }

  function moodPatternNote() {
    const moodNames = new Set(symptomsByCategory('Mood').map(i => i.name));
    const dates = rangeDates(7);
    let daysWithMood = 0, strongCount = 0;
    dates.forEach(d => {
      const dayEntries = symptomLogs.filter(l => l.date === d && moodNames.has(l.symptom));
      if (dayEntries.length) daysWithMood++;
      if (dayEntries.some(e => e.intensity === 'strong')) strongCount++;
    });
    if (daysWithMood >= 5 || strongCount >= 3) {
      return "You've logged mood-related observations often this week. If this is becoming hard to manage, it can help to talk to a doctor or therapist.";
    }
    return '';
  }

  function renderSymptomHistory() {
    const el = document.getElementById('symptomHistory');
    if (!el) return;
    const dates = rangeDates(7).reverse();
    el.innerHTML = dates.map(d => {
      const names = symptomLogs.filter(l => l.date === d).map(l => l.symptom);
      return `<div class="list-row" style="align-items:flex-start;flex-direction:column;gap:3px;">
        <div style="font-size:12.5px;color:var(--text-muted);">${niceDate(d)}</div>
        <div style="font-size:13.5px;">${names.length ? escapeHtml(names.join(', ')) : '<span style="color:var(--text-faint);">No symptoms logged</span>'}</div>
      </div>`;
    }).join('');
  }

  function renderTipsFoodResults() {
    const el = document.getElementById('tipsFoodResults');
    if (!el) return;
    const q = tipsSearch.trim().toLowerCase();
    const hit = txt => !q || txt.toLowerCase().indexOf(q) >= 0;
    let shown = 0;
    const html = TIPS_FOOD_GUIDE.map((sec, idx) => {
      let body, count;
      if (sec.kind === 'items') {
        const list = sec.items.filter(i => hit(i.n + ' ' + i.w));
        count = list.length;
        body = `<div class="tg-grid">${list.map(i => `<div class="tg-item ${i.star ? 'star' : ''} ${sec.avoid ? 'avoid' : ''}"><span class="tg-emoji">${i.e}</span><div><div class="tg-name">${escapeHtml(i.n)}${i.star ? ' ⭐' : ''}</div><div class="tg-why">${escapeHtml(i.w)}</div></div></div>`).join('')}</div>`;
      } else {
        const list = sec.ideas.filter(i => hit(i.n + ' ' + i.d + ' ' + (i.g || '')));
        count = list.length;
        let lastGroup = null;
        body = list.map(i => {
          const g = i.g && i.g !== lastGroup ? `<div class="tg-group">${escapeHtml(i.g)}</div>` : '';
          lastGroup = i.g || lastGroup;
          return `${g}<div class="tg-idea"><div class="row" style="justify-content:flex-start;gap:10px;"><span class="tg-emoji" style="font-size:24px;">${i.e}</span><div><div class="tg-name" style="font-size:14px;">${escapeHtml(i.n)}</div><div class="tg-prot">${escapeHtml(i.p)}</div></div></div><div class="tg-why" style="font-size:12.5px;margin:6px 0;">${escapeHtml(i.d)}</div><div class="chip-grid">${i.t.map(t => `<span class="tg-tag tg-${t[0]}">${escapeHtml(t[1])}</span>`).join('')}</div></div>`;
        }).join('');
      }
      if (q && !count) return '';
      shown++;
      const open = !!q || tipsOpen.has(sec.title);
      return `<div class="tg-section">
        <div class="tg-head ${sec.avoid ? 'avoid' : ''}" data-tgtoggle="${idx}" role="button" tabindex="0" aria-expanded="${open}">
          <span class="tg-icon">${sec.icon}</span>
          <div style="flex:1;"><div class="tg-title">${escapeHtml(sec.title)}</div><div class="tg-sub">${escapeHtml(sec.sub)}</div></div>
          <span class="tg-chev">${open ? '▾' : '▸'}</span>
        </div>${open ? body : ''}</div>`;
    }).join('');
    el.innerHTML = (html || '<div class="empty-note">No matches — try another word.</div>')
      + (!q ? `<div class="tg-note">${escapeHtml(TIPS_FOOD_NOTE)}</div>` : '');
    const toggle = node => {
      const title = TIPS_FOOD_GUIDE[parseInt(node.dataset.tgtoggle, 10)].title;
      if (tipsOpen.has(title)) tipsOpen.delete(title); else tipsOpen.add(title);
      renderTipsFoodResults();
    };
    el.querySelectorAll('[data-tgtoggle]').forEach(node => {
      node.addEventListener('click', () => { if (!q) toggle(node); });
      node.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !q) { e.preventDefault(); toggle(node); } });
    });
  }

  function closeOverlay() { overlay = (overlay && overlay.returnTo) ? overlay.returnTo : null; render(); }

  function renderOverlay() {
    if (!overlay) { overlaysEl.innerHTML = ''; return; }
    if (overlay.type === 'quickadd') overlaysEl.innerHTML = quickAddSheet();
    else if (overlay.type === 'quickadd-food') { currentTab = 'nutrition'; overlay = { type: 'add-food', meal: mealForNow() }; overlaysEl.innerHTML = addFoodSheet(overlay.meal); wireOverlay(); return; }
    else if (overlay.type === 'quickadd-water') overlaysEl.innerHTML = waterSheet();
    else if (overlay.type === 'add-food') overlaysEl.innerHTML = addFoodSheet(overlay.meal);
    else if (overlay.type === 'scan-meal') overlaysEl.innerHTML = scanMealSheet(overlay);
    else if (overlay.type === 'pick-meal') overlaysEl.innerHTML = pickMealSheet(overlay.food);
    else if (overlay.type === 'supplement-detail') overlaysEl.innerHTML = supplementDetailSheet(overlay.id);
    else if (overlay.type === 'import-preview') overlaysEl.innerHTML = importPreviewSheet(overlay);
    else if (overlay.type === 'import-replace-confirm') overlaysEl.innerHTML = importReplaceConfirmSheet(overlay);
    else if (overlay.type === 'import-success') overlaysEl.innerHTML = importSuccessSheet(overlay);
    else if (overlay.type === 'symptom-intensity') overlaysEl.innerHTML = symptomIntensitySheet(overlay.symptom);
    else if (overlay.type === 'period-log') overlaysEl.innerHTML = periodLogSheet(overlay);
    else if (overlay.type === 'period-edit') overlaysEl.innerHTML = periodEditSheet(overlay);
    else if (overlay.type === 'reminders') overlaysEl.innerHTML = remindersSheet(overlay);
    else if (overlay.type === 'clear-data') overlaysEl.innerHTML = clearDataSheet(overlay);
    else if (overlay.type === 'reminder-edit') overlaysEl.innerHTML = reminderEditSheet(overlay);
    else if (overlay.type === 'add-custom-symptom') overlaysEl.innerHTML = addCustomSymptomSheet();
    else if (overlay.type === 'quickadd-weight') overlaysEl.innerHTML = quickWeightSheet();
    else if (overlay.type === 'quickadd-supplement') { currentTab='home'; closeOverlay(); return; }
    else if (overlay.type === 'settings') overlaysEl.innerHTML = settingsSheet();
    wireOverlay();
  }

  function scanTotals(foods) {
    return foods.reduce((t,f) => ({
      calories: t.calories+(+f.calories||0), protein: t.protein+(+f.protein||0),
      carbs: t.carbs+(+f.carbs||0), fat: t.fat+(+f.fat||0), fiber: t.fiber+(+f.fiber||0),
    }), {calories:0,protein:0,carbs:0,fat:0,fiber:0});
  }

  function rescaleFood(f, newQty) {
    newQty = Math.max(0.1, newQty);
    const ratio = f.base.qty > 0 ? newQty / f.base.qty : 1;
    f.qty = Math.round(newQty * 10) / 10;
    f.calories = Math.round(f.base.calories * ratio);
    f.protein = Math.round(f.base.protein * ratio * 10) / 10;
    f.carbs = Math.round(f.base.carbs * ratio * 10) / 10;
    f.fat = Math.round(f.base.fat * ratio * 10) / 10;
    f.fiber = Math.round(f.base.fiber * ratio * 10) / 10;
  }

  function resizeImageFile(file, maxDim) {
    return new Promise((resolve) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        URL.revokeObjectURL(url);
        canvas.toBlob((blob) => {
          resolve(blob ? new File([blob], file.name || 'photo.jpg', { type: 'image/jpeg' }) : file);
        }, 'image/jpeg', 0.82);
      };
      img.onerror = () => resolve(file);
      img.src = url;
    });
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const m = /^data:(.+);base64,(.*)$/.exec(reader.result || '');
        if (!m) return reject(new Error('read failed'));
        resolve({ mediaType: m[1], data: m[2] });
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function scanErrorMessage(e) {
    const code = e && e.code;
    const map = {
      not_granted: "AI scanning isn't available in this view.",
      images_unavailable: "Photos aren't supported in this view — try a text description instead.",
      image_rejected: 'That photo could not be used — try a different one.',
      rate_limited: 'Too many requests right now — wait a moment and try again.',
      refused: "Couldn't analyze that photo — try a clearer one.",
      empty_completion: 'No result came back — try again.',
      invalid_json: "Couldn't read the result — try again.",
      backend_error: "Scanning isn't set up on this deployment yet.",
    };
    return map[code] || "Something went wrong analyzing that photo — try again with a clearer, well-lit photo.";
  }

  async function runMealScan(file, desc) {
    const prompt = 'You are analyzing a photo of a meal for a personal nutrition-tracking app (not medical advice). Identify each distinct food item visible, separately rather than as one generic dish where possible. '
      + (desc ? 'Context from the user: ' + JSON.stringify(desc) + '. ' : '')
      + 'For each food, estimate: name (short string), quantity (number), unit (one of g, kg, ml, oz, cup, tbsp, tsp, piece, slice, serving), calories (kcal), protein (g), carbs (g), fat (g), fiber (g), confidence ("high", "medium", or "low"), and an optional short note for anything uncertain, e.g. "possible 1 tsp oil, not clearly visible". '
      + 'These are ESTIMATES from a photo, not exact measurements — reflect real uncertainty honestly in the confidence field (use "low" when portion, oil, or sauce amounts cannot be determined) rather than defaulting to high confidence. '
      + 'Reply with ONLY a JSON object, no other text: {"foods":[{"name":"","quantity":0,"unit":"g","calories":0,"protein":0,"carbs":0,"fat":0,"fiber":0,"confidence":"medium","note":""}]}';

    let data;
    if (sampleFn) {
      data = await sampleFn.json(prompt, { modelTier: 'quick', images: file });
    } else if (typeof fetch === 'function' && !window.claude) {
      const img = await fileToBase64(file);
      const res = await fetch('/.netlify/functions/analyze-food', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageBase64: img.data, mediaType: img.mediaType, prompt }),
      });
      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        throw { code: errBody.code || 'backend_error' };
      }
      data = await res.json();
    } else {
      throw { code: 'not_granted' };
    }

    return (data.foods || []).map(f => {
      const qty = Number(f.quantity) || 1;
      const calories = Number(f.calories) || 0;
      const protein = Number(f.protein) || 0;
      const carbs = Number(f.carbs) || 0;
      const fat = Number(f.fat) || 0;
      const fiber = Number(f.fiber) || 0;
      return {
        name: f.name || 'Food item',
        qty, unit: UNIT_OPTIONS.includes(f.unit) ? f.unit : 'g',
        calories, protein, carbs, fat, fiber,
        confidence: ['high','medium','low'].includes(f.confidence) ? f.confidence : 'medium',
        note: f.note || '',
        base: { qty, calories, protein, carbs, fat, fiber },
      };
    });
  }

  function wireScanReview() {
    const foods = overlay.foods;
    document.getElementById('scanMealPick').addEventListener('change', (e) => { overlay.meal = e.target.value; });
    document.querySelectorAll('.sf-name').forEach(inp => inp.addEventListener('change', e => { foods[+inp.dataset.i].name = e.target.value; }));
    document.querySelectorAll('.sf-unit').forEach(sel => sel.addEventListener('change', e => { foods[+sel.dataset.i].unit = e.target.value; }));
    document.querySelectorAll('.sf-field').forEach(inp => inp.addEventListener('change', e => {
      foods[+inp.dataset.i][inp.dataset.field] = parseFloat(inp.value) || 0;
    }));
    document.querySelectorAll('.sf-qty').forEach(inp => inp.addEventListener('change', e => {
      rescaleFood(foods[+inp.dataset.i], parseFloat(inp.value) || foods[+inp.dataset.i].qty);
      render();
    }));
    document.querySelectorAll('.sf-dec').forEach(btn => btn.addEventListener('click', () => {
      const f = foods[+btn.dataset.i]; rescaleFood(f, f.qty * 0.9); render();
    }));
    document.querySelectorAll('.sf-inc').forEach(btn => btn.addEventListener('click', () => {
      const f = foods[+btn.dataset.i]; rescaleFood(f, f.qty * 1.1); render();
    }));
    document.querySelectorAll('.sf-scale').forEach(btn => btn.addEventListener('click', () => {
      const f = foods[+btn.dataset.i]; rescaleFood(f, f.base.qty * parseFloat(btn.dataset.scale)); render();
    }));
    document.querySelectorAll('[data-del]').forEach(x => x.addEventListener('click', () => {
      foods.splice(+x.dataset.del, 1); render();
    }));
    document.getElementById('scanAddItemBtn').addEventListener('click', () => {
      foods.push({ name: 'New item', qty: 100, unit: 'g', calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0, confidence: 'low', note: 'Added manually', base: { qty: 100, calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0 } });

      const btn = document.getElementById('scanConfirmBtn');

      const meal = overlay.meal || mealForNow();

      closeOverlay();
    });
    document.getElementById('scanCancelBtn').addEventListener('click', closeOverlay);
  }

  function wireOverlay() {
    const backdrop = document.getElementById('ovBackdrop');
    if (!backdrop) return;
    backdrop.addEventListener('click', e => { if (e.target === backdrop) closeOverlay(); });
    const closeBtn = document.getElementById('ovClose');

    }

      const cb = document.getElementById('customWaterSave');

        if (v>0) { addWater(v); closeOverlay(); }
      });
    }
    if (overlay.type === 'quickadd-weight') {
      document.getElementById('qwSave').addEventListener('click', () => {

        upsertWeight(todayStr(), displayToKg(v)); closeOverlay();
      });
    }
    if (overlay.type === 'scan-meal') {

        fileInput.addEventListener('change', () => {
          const f = fileInput.files[0];
          document.getElementById('scanPhotoName').textContent = f ? f.name : '';
          goBtn.disabled = !f;
        });
        goBtn.addEventListener('click', async () => {
          const file = fileInput.files[0];
          if (!file) return;
          const desc = document.getElementById('scanDesc').value.trim();
          overlay = { type: 'scan-meal', stage: 'loading' };
          render();
          runLoadingTextCycle();
          try {
            const resized = await resizeImageFile(file, 1024);
            const foods = await runMealScan(resized, desc);
            if (!foods || foods.length === 0) {
              overlay = { type: 'scan-meal', stage: 'pick', error: "I couldn't confidently identify food in this photo. Try a photo from directly above with better lighting." };
            } else {
              overlay = { type: 'scan-meal', stage: 'review', foods, meal: mealForNow() };
            }
          } catch (e) {
            overlay = { type: 'scan-meal', stage: 'pick', error: scanErrorMessage(e) };
          }
          render();
        });
      } else if (overlay.stage === 'review') {
        wireScanReview();
      }
    }
    if (overlay.type === 'import-preview') {
      document.getElementById('importMergeBtn').addEventListener('click', async () => {
        const backup = overlay.backup;
        const counts = await mergeBackup(backup);
        overlay = { type: 'import-success', counts };
        render();
      });
      document.getElementById('importReplaceBtn').addEventListener('click', () => {
        overlay = { type: 'import-replace-confirm', backup: overlay.backup };
        render();
      });
      document.getElementById('importCancelBtn').addEventListener('click', closeOverlay);
    }
    if (overlay.type === 'import-replace-confirm') {
      document.getElementById('importReplaceConfirmBtn').addEventListener('click', async () => {
        const backup = overlay.backup;
        const counts = await replaceUserData(backup);
        overlay = { type: 'import-success', counts };
        render();
      });
      document.getElementById('importReplaceCancelBtn').addEventListener('click', closeOverlay);
    }
    if (overlay.type === 'import-success') {
      document.getElementById('importContinueBtn').addEventListener('click', closeOverlay);
    }
    if (overlay.type === 'clear-data') {
      const ov = overlay;
      if (ov.stage === 'choose') {
        document.querySelectorAll('input[name="clMode"]').forEach(r => r.addEventListener('change', () => { ov.mode = r.value; }));
        document.getElementById('clExport').addEventListener('click', () => exportData());
        document.getElementById('clCancel').addEventListener('click', closeOverlay);
        armConfirm(document.getElementById('clGo'), 'Tap again to permanently clear', async () => {
          ov.stage = 'working'; ov.progress = 'Clearing\u2026'; ov.returnTo = null; render();
          try {
            await clearData(ov.mode, txt => { ov.progress = txt; render(); });
            ov.stage = 'done'; ov.error = '';
          } catch (e) {
            ov.stage = 'choose'; ov.error = 'Couldn\u2019t finish clearing (' + ((e && e.message) || 'unknown error') + '). Some items may remain \u2014 please try again.';
          }

    if (overlay.type === 'reminders') {

        overlay = { type: 'reminder-edit', id: null, draft: newReminderDraft(b.dataset.addrem), returnTo: overlay };

      document.querySelectorAll('[data-wd]').forEach(c => c.addEventListener('click', () => {

      document.getElementById('reSave').addEventListener('click', async () => {
        syncDraft();
        const d = ov.draft;

        const err = validateReminderDraft(draft, ov.id);

        await addOrUpdateReminder(draft, ov.id);
        closeOverlay();
      });
      document.getElementById('reCancel').addEventListener('click', closeOverlay);
      const delBtn = document.getElementById('reDelete');
      if (delBtn) armConfirm(delBtn, 'Tap again to delete', async () => {

    if (overlay.type === 'period-log') {

    if (overlay.type === 'period-edit' && document.getElementById('peSave')) {

          render();
