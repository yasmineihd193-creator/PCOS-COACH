          statusEl.textContent = "Couldn't read that file.";
        }
        input.value = '';
      });
      document.getElementById('clearBtn').addEventListener('click', () => { overlay = { type: 'clear-data', mode: 'logs', stage: 'choose', error: '', returnTo: { type: 'settings' } }; render(); });
    }
  }

  function renderSuppEditList() {
    const el = document.getElementById('suppEditList');
    if (!el) return;
    if (supplements.length===0) { el.innerHTML = `<div class="empty-note">No supplements added yet.</div>`; return; }
    el.innerHTML = supplements.map((s, i) => `
      <div class="list-row">
        <div style="flex:1;cursor:pointer;" data-editsupp="${s.id}">
          <div style="font-size:14px;">${escapeHtml(s.name)}</div>
          <div style="font-size:12px;color:var(--text-muted);">${escapeHtml(s.purpose||'')}</div>
        </div>
        <div class="row" style="gap:10px;">
          <span data-moveup="${s.id}" style="color:${i===0?'var(--text-faint)':'var(--text-muted)'};cursor:pointer;">▲</span>
          <span data-movedown="${s.id}" style="color:${i===supplements.length-1?'var(--text-faint)':'var(--text-muted)'};cursor:pointer;">▼</span>
          <span data-rmsupp="${s.id}" style="color:var(--text-faint);cursor:pointer;">✕</span>
        </div>
      </div>
    `).join('');
    el.querySelectorAll('[data-editsupp]').forEach(x => x.addEventListener('click', () => {
      overlay = { type: 'supplement-detail', id: x.dataset.editsupp }; render();
    }));
    el.querySelectorAll('[data-moveup]').forEach(x => x.addEventListener('click', () => moveSupplement(x.dataset.moveup, -1)));
    el.querySelectorAll('[data-movedown]').forEach(x => x.addEventListener('click', () => moveSupplement(x.dataset.movedown, 1)));
    el.querySelectorAll('[data-rmsupp]').forEach(x => x.addEventListener('click', () => {
      saveSupplements(supplements.filter(s => s.id !== x.dataset.rmsupp));
      renderSuppEditList();
    }));
  }

  function moveSupplement(id, dir) {
    const i = supplements.findIndex(s => s.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= supplements.length) return;
    const list = [...supplements];
    [list[i], list[j]] = [list[j], list[i]];
    saveSupplements(list);
    renderSuppEditList();
  }

  // ---------------- BackupService ----------------
  // Versioned, schema-independent export/import. Every new data category added
  // to the app should be added to exportUserData() and to replaceUserData()/
  // mergeBackup()'s key-function map below — that's the whole contract.
  const BACKUP_VERSION = '1.0';
  const APP_VERSION = '1.0.0';
  const SUPPORTED_BACKUP_VERSIONS = ['1.0'];

  function exportUserData() {
    return {
      backupVersion: BACKUP_VERSION,
      appVersion: APP_VERSION,
      exportedAt: new Date().toISOString(),
      profile,
      goals,
      nutrition: foodEntries,
      customFoods: myFoods,
      foodScans: [], // scan confidence/notes are stored inline on nutrition entries, not a separate log
      weight: weightLogs,
      measurements: [], // not yet a feature in this app — reserved for forward compatibility
      workouts: [],     // not yet a feature in this app — reserved for forward compatibility
      activity: [],     // not yet a feature in this app — reserved for forward compatibility
      hydration: waterEntries,
      supplements,
      supplementHistory: supplementLogs,
      symptoms: symptomLogs,
      customSymptomDefs,
      healthMeasurements,
      checkins: [], // not a current feature — reserved for forward compatibility
      cycle: cycleEntries,
      reminders: reminders.filter(r => !r.temp),
      settings: {},
    };
  }

  function migrateBackupVersion(obj) {
    // Older formats are upgraded here before preview/merge/replace see them.
    // v1.0 backups from before the period model stored loose cycle events.
    if (Array.isArray(obj.cycle)) obj.cycle = migrateCycleEntries(obj.cycle).records;
    if (obj.reminders && !Array.isArray(obj.reminders)) obj.reminders = [];
    return obj;
  }

  function validateBackup(obj) {
    if (!obj || typeof obj !== 'object') return { ok: false, reason: "This file doesn't appear to be a valid PCOS Coach backup." };
    if (!obj.backupVersion) return { ok: false, reason: "This file doesn't appear to be a valid PCOS Coach backup." };
    if (!SUPPORTED_BACKUP_VERSIONS.includes(String(obj.backupVersion))) {
      return { ok: false, reason: `This backup uses a format (version ${obj.backupVersion}) this version of the app doesn't understand yet.` };
    }
    const hasAnyData = ['nutrition','weight','hydration','supplements','supplementHistory','symptoms','cycle','customFoods','customSymptomDefs','healthMeasurements','reminders']
      .some(k => Array.isArray(obj[k]));
    if (!hasAnyData) return { ok: false, reason: "This file doesn't appear to contain any PCOS Coach data." };
    return { ok: true };
  }

  function previewBackup(obj) {
    const counts = {
      'Nutrition entries': (obj.nutrition||[]).length,
      'Custom foods': (obj.customFoods||[]).length,
      'Weight entries': (obj.weight||[]).length,
      'Hydration entries': (obj.hydration||[]).length,
      'Supplements': (obj.supplements||[]).length,
      'Supplement history': (obj.supplementHistory||[]).length,
      'Symptom check-ins': (obj.symptoms||[]).length,
      'Custom symptoms': (obj.customSymptomDefs||[]).length,
      'Health measurements': (obj.healthMeasurements||[]).length,
      'Reminders': (obj.reminders||[]).length,
      'Cycle entries': (obj.cycle||[]).length,
    };
    let dateLabel = 'Unknown date';
    if (obj.exportedAt) {
      const d = new Date(obj.exportedAt);
      if (!isNaN(d)) dateLabel = d.toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' });
    }
    return { dateLabel, appVersion: obj.appVersion || 'Unknown', counts };
  }

  function dedupeMergeArray(existing, incoming, keyFn, needsId) {
    const seen = new Set(existing.map(keyFn));
    const added = [];
    incoming.forEach(item => {
      const k = keyFn(item);
      if (seen.has(k)) return;
      seen.add(k);
      if (needsId && !item.id) item.id = uid();
      existing.push(item);
      added.push(item);
    });
    return added;
  }

  async function mergeBackup(obj) {
    obj = migrateBackupVersion(obj);
    const counts = {};

    // Profile & goals: fill in only fields that are currently empty — never overwrite.
    if (obj.profile) {
      const p = { ...profile };
      Object.keys(obj.profile).forEach(k => { if (p[k] == null || p[k] === '') p[k] = obj.profile[k]; });
      await saveProfile(p);
    }
    if (obj.goals) {
      const g = { ...goals };
      Object.keys(obj.goals).forEach(k => { if (g[k] == null) g[k] = obj.goals[k]; });
      await saveGoals(g);
    }

    // Supplements merge by name so adherence history can be remapped correctly.
    const idRemap = {};
    let addedSupplements = 0;
    if (Array.isArray(obj.supplements)) {
      const current = [...supplements];
      obj.supplements.forEach(s => {
        const match = current.find(c => c.name.trim().toLowerCase() === (s.name||'').trim().toLowerCase());
        if (match) { idRemap[s.id] = match.id; }
        else { current.push(s); idRemap[s.id] = s.id; addedSupplements++; }
      });
      await saveSupplements(current);
    }
    counts['Supplements'] = addedSupplements;

    const addedFood = Array.isArray(obj.nutrition) ? dedupeMergeArray(foodEntries, obj.nutrition, e => e.id || `${e.date}|${e.meal}|${e.name}|${e.calories}`, true) : [];
    const addedCustomFoods = Array.isArray(obj.customFoods) ? dedupeMergeArray(myFoods, obj.customFoods, e => (e.name||'').toLowerCase().trim()+'|'+e.calories, true) : [];
    const addedWeight = Array.isArray(obj.weight) ? dedupeMergeArray(weightLogs, obj.weight, e => e.date, false) : [];
    const addedWater = Array.isArray(obj.hydration) ? dedupeMergeArray(waterEntries, obj.hydration, e => e.id || `${e.date}|${e.ml}|${e.time}`, true) : [];
    const addedCycle = Array.isArray(obj.cycle) ? dedupeMergeArray(cycleEntries, obj.cycle, e => e.startDate ? 'start:' + e.startDate : (e.id || 'x' + (e.spottingDates || []).join(',')), true) : [];
    const addedSymptoms = Array.isArray(obj.symptoms) ? dedupeMergeArray(symptomLogs, obj.symptoms, e => e.id || `${e.date}__${e.symptom}`, true) : [];
    const addedHealthMeasurements = Array.isArray(obj.healthMeasurements) ? dedupeMergeArray(healthMeasurements, obj.healthMeasurements, e => e.date, false) : [];

    const addedReminders = [];
    if (Array.isArray(obj.reminders)) {
      const sig = r => [r.category, r.time, r.recurrence, [...(r.weekdays || [])].sort().join(','), r.date || '', r.label || ''].join('|');
      const have = new Set(reminders.map(sig));
      const perCat = {};
      reminders.forEach(r => { perCat[r.category] = (perCat[r.category] || 0) + 1; });
      obj.reminders.map(normalizeReminder).forEach(r => {
        if (have.has(sig(r)) || (perCat[r.category] || 0) >= REMINDER_LIMITS[r.category]) return;
        have.add(sig(r)); perCat[r.category] = (perCat[r.category] || 0) + 1; addedReminders.push(r);
      });
      if (addedReminders.length) await saveReminders([...reminders, ...addedReminders], { sync: true });
    }

    let addedCustomSymptoms = [];
    if (Array.isArray(obj.customSymptomDefs)) {
      const current = [...customSymptomDefs];
      obj.customSymptomDefs.forEach(c => {
        const exists = current.some(x => x.name.trim().toLowerCase() === (c.name||'').trim().toLowerCase());
        if (!exists) { current.push(c); addedCustomSymptoms.push(c); }
      });
      await saveCustomSymptomDefs(current);
    }

    let addedHistory = [];
    if (Array.isArray(obj.supplementHistory)) {
      const remapped = obj.supplementHistory.map(h => {
        const suppId = idRemap[h.suppId] || h.suppId;
        return { ...h, suppId, id: `${h.date}_${suppId}` };
      });
      addedHistory = dedupeMergeArray(supplementLogs, remapped, e => e.id, false);
    }

    counts['Nutrition entries'] = addedFood.length;
    counts['Custom foods'] = addedCustomFoods.length;
    counts['Weight entries'] = addedWeight.length;
    counts['Hydration entries'] = addedWater.length;
    counts['Cycle entries'] = addedCycle.length;
    counts['Symptom check-ins'] = addedSymptoms.length;
    counts['Custom symptoms'] = addedCustomSymptoms.length;
    counts['Health measurements'] = addedHealthMeasurements.length;
    counts['Reminders'] = addedReminders.length;
    counts['Supplement history'] = addedHistory.length;

    if (localMode) {
      saveLocal();
    } else {
      await Promise.all([
        ...addedWeight.map(e => docSave('logs', e.date, e)),
        ...addedFood.map(e => docSave('foodEntries', e.id, e)),
        ...addedCustomFoods.map(e => docSave('foods', e.id, e)),
        ...addedWater.map(e => docSave('waterEntries', e.id, e)),
        ...addedCycle.map(e => docSave('cycleEntries', e.id, e)),
        ...addedSymptoms.map(e => docSave('symptomLogs', e.id, e)),
        ...addedHistory.map(e => docSave('supplementLogs', e.id, e)),
        ...addedHealthMeasurements.map(e => docSave('healthMeasurements', e.date, e)),
      ]);
    }
    render();
    return counts;
  }

  async function replaceUserData(obj) {
    obj = migrateBackupVersion(obj);
    const ensureId = e => { if (!e.id) e.id = uid(); return e; };

    if (obj.profile) profile = { ...profile, ...obj.profile };
    if (obj.goals) goals = { ...goals, ...obj.goals };
    supplements = Array.isArray(obj.supplements) ? obj.supplements.map(ensureId) : [];
    foodEntries = Array.isArray(obj.nutrition) ? obj.nutrition.map(ensureId) : [];
    myFoods = Array.isArray(obj.customFoods) ? obj.customFoods.map(ensureId) : [];
    weightLogs = Array.isArray(obj.weight) ? obj.weight : [];
    waterEntries = Array.isArray(obj.hydration) ? obj.hydration.map(ensureId) : [];
    cycleEntries = Array.isArray(obj.cycle) ? obj.cycle.map(ensureId) : [];
    symptomLogs = Array.isArray(obj.symptoms) ? obj.symptoms.map(ensureId) : [];
    supplementLogs = Array.isArray(obj.supplementHistory) ? obj.supplementHistory.map(ensureId) : [];
    customSymptomDefs = Array.isArray(obj.customSymptomDefs) ? obj.customSymptomDefs.map(ensureId) : [];
    healthMeasurements = Array.isArray(obj.healthMeasurements) ? obj.healthMeasurements : [];
    reminders = Array.isArray(obj.reminders) ? obj.reminders.map(normalizeReminder) : [];
    queueSync();

    if (localMode) {
      saveLocal(); render();
      return previewBackup(obj).counts;
    }

    await Promise.all(['logs','foodEntries','foods','waterEntries','supplementLogs','cycleEntries','symptomLogs','healthMeasurements'].map(async name => {
      try {
        const snap = await cols[name].get();
        await Promise.all(snap.docs.map(d => cols[name].doc(d.id).delete().catch(()=>{})));
      } catch (e) {}
    }));
    await Promise.all([
      ...weightLogs.map(e => docSave('logs', e.date, e)),
      ...foodEntries.map(e => docSave('foodEntries', e.id, e)),
      ...myFoods.map(e => docSave('foods', e.id, e)),
      ...waterEntries.map(e => docSave('waterEntries', e.id, e)),
      ...cycleEntries.map(e => docSave('cycleEntries', e.id, e)),
      ...symptomLogs.map(e => docSave('symptomLogs', e.id, e)),
      ...supplementLogs.map(e => docSave('supplementLogs', e.id, e)),
      ...healthMeasurements.map(e => docSave('healthMeasurements', e.date, e)),
      saveSupplements(supplements),
      saveCustomSymptomDefs(customSymptomDefs),
      docSaveSettings('reminders', { list: reminders }),
      obj.profile ? saveProfile(profile) : Promise.resolve(),
      obj.goals ? saveGoals(goals) : Promise.resolve(),
    ]);
    render();
    return previewBackup(obj).counts;
  }

  function updateLastBackupLabel() {
    const el = document.getElementById('lastBackupLabel');
    if (!el) return;
    let iso = null;
    try { iso = localStorage.getItem('lastBackupAt_v1'); } catch (e) {}
    if (!iso) { el.textContent = 'Never'; return; }
    const d = new Date(iso);
    el.textContent = isNaN(d) ? 'Never' : d.toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' });
  }

  function backupReminderNote() {
    let pref = 'off', lastIso = null;
    try { pref = localStorage.getItem('backupReminder_v1') || 'off'; lastIso = localStorage.getItem('lastBackupAt_v1'); } catch (e) {}
    if (pref === 'off') return '';
    const days = pref === 'weekly' ? 7 : 30;
    if (!lastIso) return `You haven't backed up yet — ${pref} reminder is on.`;
    const diffDays = Math.floor((Date.now() - new Date(lastIso).getTime()) / 86400000);
    return diffDays >= days ? `It's been ${diffDays} days since your last backup.` : '';
  }

  // ---------------- reminders: data model ----------------
  // Reminder: { id, category: 'water'|'supplements'|'weighing', title, label, enabled, time 'HH:mm',
  //             recurrence: 'daily'|'weekly'|'once', weekdays: number[] (0=Sun), date 'YYYY-MM-DD'|null,
  //             createdAt, updatedAt }
  // A reminder only schedules a notification. It never logs water, supplements or weight by itself.
  const REMINDER_CATEGORIES = {
    water: { emoji: '💧', name: 'Water', defaultTime: '09:00', title: 'Drink water' },
    supplements: { emoji: '💊', name: 'Supplements', defaultTime: '07:30', title: 'Supplements' },
    weighing: { emoji: '⚖️', name: 'Weighing', defaultTime: '07:30', title: 'Weigh yourself' },
  };
  const REMINDER_LIMITS = { water: 12, supplements: 8, weighing: 3 };
  const WEEKDAY_ORDER = [1, 2, 3, 4, 5, 6, 0];
  const WEEKDAY_SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const LABEL_SUGGESTIONS = ['Morning', 'Midday', 'Evening', 'Bedtime'];

  function fmtTime(t) {
    const [h, m] = String(t).split(':').map(Number);
    return new Date(2000, 0, 1, h || 0, m || 0).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  function reminderTitle(r) {
    if (r.category === 'supplements') return r.label ? r.label + ' supplements' : 'Supplements';
    return REMINDER_CATEGORIES[r.category].title;
  }
  function normalizeReminder(r) {
    const cat = REMINDER_CATEGORIES[r.category] ? r.category : 'water';
    const now = new Date().toISOString();
    const out = {
      id: r.id || uid(), category: cat, label: String(r.label || '').slice(0, 24), enabled: r.enabled !== false,
      time: /^([01]\d|2[0-3]):[0-5]\d$/.test(r.time || '') ? r.time : REMINDER_CATEGORIES[cat].defaultTime,
      recurrence: ['daily', 'weekly', 'once'].indexOf(r.recurrence) >= 0 ? r.recurrence : 'daily',
      weekdays: Array.isArray(r.weekdays) ? r.weekdays.filter(d => d >= 0 && d <= 6) : [],
      date: r.date || null, createdAt: r.createdAt || now, updatedAt: r.updatedAt || now,
    };
    out.title = reminderTitle(out);
    if (r.temp) out.temp = true;   // temporary diagnostic reminder
    return out;
  }
  function recurrenceSummary(r) {
    if (r.recurrence === 'once') return 'Once · ' + (r.date ? fmtDateShort(r.date) : '');
    if (r.recurrence === 'weekly') {
      const days = WEEKDAY_ORDER.filter(d => (r.weekdays || []).indexOf(d) >= 0);
      return days.length === 7 ? 'Every day' : days.map(d => WEEKDAY_SHORT[d]).join(', ');
    }
    return 'Every day';
  }
  function reminderAppliesOn(r, dateStr) {
    if (r.recurrence === 'once') return r.date === dateStr;
    if (r.recurrence === 'weekly') return (r.weekdays || []).indexOf(new Date(dateStr + 'T00:00:00').getDay()) >= 0;
    return true;
  }
  function isExpiredOnce(r) {
    return r.recurrence === 'once' && !!r.date && new Date(r.date + 'T' + r.time + ':00') <= new Date();
  }
  function isReminderActive(r) { return r.enabled && !isExpiredOnce(r); }
  function activeCount(cat) { return reminders.filter(r => r.category === cat && isReminderActive(r)).length; }
  function remindersFor(cat) { return reminders.filter(r => r.category === cat).sort((a, b) => (a.time < b.time ? -1 : a.time > b.time ? 1 : 0)); }
  function todaysReminders() {
    const d = todayStr();
    return reminders.filter(r => isReminderActive(r) && reminderAppliesOn(r, d)).sort((a, b) => (a.time < b.time ? -1 : 1));
  }
  function newReminderDraft(category) {
    return { category, label: '', time: REMINDER_CATEGORIES[category].defaultTime, recurrence: 'daily', weekdays: [], date: null, enabled: true };
  }
  function sameDays(a, b) { return [...(a || [])].sort().join(',') === [...(b || [])].sort().join(','); }
  function validateReminderDraft(d, existingId) {
    const meta = REMINDER_CATEGORIES[d.category];
    if (!meta) return 'Choose a category.';
    if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(d.time || '')) return 'Choose a time.';
    if (d.recurrence === 'weekly' && !(d.weekdays || []).length) return 'Pick at least one day.';
    if (d.recurrence === 'once') {
      if (!d.date) return 'Pick a date.';
      if (d.enabled && new Date(d.date + 'T' + d.time + ':00') <= new Date()) return 'Pick a date and time in the future.';
    }
    const dup = reminders.find(r => r.id !== existingId && r.category === d.category && r.time === d.time && r.recurrence === d.recurrence
      && sameDays(r.weekdays, d.recurrence === 'weekly' ? d.weekdays : []) && (r.date || null) === (d.recurrence === 'once' ? d.date : null)
      && (r.label || '') === (d.label || ''));
    if (dup) return 'You already have this exact ' + meta.name.toLowerCase() + ' reminder at ' + fmtTime(d.time) + ' (' + recurrenceSummary(dup) + ').';
    if (!existingId && reminders.filter(r => r.category === d.category).length >= REMINDER_LIMITS[d.category]) {
      return 'You\u2019ve reached the limit of ' + REMINDER_LIMITS[d.category] + ' ' + meta.name.toLowerCase() + ' reminders. Delete one to add another.';
    }
    return null;
  }

  // Reminders created by earlier versions (global water/weigh-in prefs, per-supplement reminder times).
  function buildLegacyReminders() {
    const out = [];
    const pad = n => String(n).padStart(2, '0');
    try {
      const raw = localStorage.getItem('notifPrefs_v1');
      if (raw) {
        const p = JSON.parse(raw);
        if (p.weighIn && p.weighIn.enabled) out.push(normalizeReminder({ category: 'weighing', time: p.weighIn.time || '07:30' }));
        if (p.water && p.water.enabled) {
          const toMin = t => { const a = String(t).split(':').map(Number); return a[0] * 60 + a[1]; };
          const start = toMin(p.water.start || '09:00'), end = toMin(p.water.end || '21:00'), step = Math.max(1, p.water.interval || 3) * 60;
          let n = 0;
          for (let m = start; m <= end && n < REMINDER_LIMITS.water; m += step, n++) out.push(normalizeReminder({ category: 'water', time: pad(Math.floor(m / 60)) + ':' + pad(m % 60) }));
        }
      }
    } catch (e) {}
    const times = {};
    supplements.forEach(sp => { if (sp.reminderEnabled) times[sp.reminderTime || '09:00'] = true; });
    Object.keys(times).sort().slice(0, REMINDER_LIMITS.supplements).forEach(t => out.push(normalizeReminder({ category: 'supplements', time: t })));
    return out;
  }

  async function saveReminders(list, opts) {
    reminders = list;
    render();
    if (localMode) saveLocal(); else await docSaveSettings('reminders', { list });
    if (opts && opts.sync) queueSync();
  }
  async function addOrUpdateReminder(draft, existingId) {
    const now = new Date().toISOString();
    let saved, list;
    if (existingId) {
      const old = reminders.find(r => r.id === existingId);
      saved = normalizeReminder({ ...old, ...draft, id: old.id, createdAt: old.createdAt, updatedAt: now });
      list = reminders.map(r => (r.id === existingId ? saved : r));
    } else {
      saved = normalizeReminder({ ...draft, id: uid(), createdAt: now, updatedAt: now });
      list = [...reminders, saved];
    }
    await saveReminders(list);
    if (existingId) NotificationService.updateReminder(saved); else NotificationService.scheduleReminder(saved);
    return saved;
  }
  async function toggleReminder(id, enabled) {
    const old = reminders.find(r => r.id === id);
    if (!old) return;
    const saved = normalizeReminder({ ...old, enabled, updatedAt: new Date().toISOString() });
    await saveReminders(reminders.map(r => (r.id === id ? saved : r)));
    NotificationService.updateReminder(saved);
  }
  async function deleteReminder(id) {
    await saveReminders(reminders.filter(r => r.id !== id));
    NotificationService.cancelReminder(id);
  }

  // ---------------- notification service ----------------
  // The UI and data layer only talk to NotificationService. Today its provider is Web Push
  // through a service worker plus a small scheduled backend (see /netlify). The server holds the
  // COMPLETE schedule and every sync replaces it, keyed by reminder id, so an edited or deleted
  // reminder can never leave an old notification behind or create a duplicate.
  function swReady() {
    return Promise.race([
      navigator.serviceWorker.ready,
      new Promise((_, rej) => setTimeout(() => rej(new Error('service worker not available')), 6000)),
    ]);
  }
  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(base64);
    const out = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

    let target = new Date(Date.now() + 60000);
    if (target.getSeconds() || target.getMilliseconds()) { target.setSeconds(0, 0); target.setMinutes(target.getMinutes() + 1); }
    const hhmm = pad2(target.getHours()) + ':' + pad2(target.getMinutes());
    const saved = await addOrUpdateReminder({ category: 'water', label: 'Test', time: hhmm, recurrence: 'once', date: localDateStr(target), weekdays: [], enabled: true, temp: true }, null);
    diag.test = { id: saved.id, targetISO: target.toISOString(), hhmm, startedAtISO: new Date().toISOString(), phase: 'waiting', lines: [], syncing: true };
    try { localStorage.setItem(TEST_MARKER, JSON.stringify({ id: saved.id, targetISO: diag.test.targetISO, hhmm, startedAtISO: diag.test.startedAtISO })); } catch (e) {}
    rerenderReminders();
    await runSync();
    diag.test.syncing = false;
    if (notifState.sync.state !== 'ok') {
      const msg = (notifState.sync.message || 'unknown error');
      await deleteReminder(saved.id); clearTestMarker();
      return fail('Couldn\u2019t schedule the test on the server: ' + msg);
    }
    rerenderReminders();
    // UI-only: look at the outcome shortly after the scheduled minute. This timer does NOT deliver anything.
    setTimeout(() => { checkWaterTest(); }, Math.max(0, target.getTime() - Date.now()) + 70000);
  }

  async function readSwDiag() {
    const reg = await currentRegistration();
    const pong = reg ? await pingServiceWorker(reg) : null;
    return pong ? (pong.diag || {}) : null;
  }

  async function checkWaterTest() {
    const t = diag.test || null;
    if (!t || t.phase === 'done' || t.phase === 'checking' || !t.targetISO) return;
    if (Date.now() < new Date(t.targetISO).getTime() + 45000) return;
    t.phase = 'checking'; rerenderReminders();
    const lines = [];
    let sub = null;
    try { sub = await WebPushNetlifyProvider.getSubscription(); } catch (e) {}
    let backend = null;
    try { backend = await fetchBackendStatus(sub && sub.endpoint); } catch (e) { lines.push({ state: 'fail', text: 'Couldn\u2019t reach the backend to check: ' + ((e && e.message) || e) }); }
    if (backend && backend.data) {
      const d = backend.data;
      const mine = (d.sends || []).filter(x => x.id === t.id);
      const ok = mine.find(x => x.ok), bad = mine.filter(x => !x.ok).slice(-1)[0], sc = d.scheduler || {};
      if (ok) lines.push({ state: 'ok', text: 'Server sent it at ' + fmtClock(ok.at) + ' \u2014 the push service accepted it (' + ok.status + ').' });
      else if (bad) lines.push({ state: 'fail', text: 'The server tried to send it but the push service rejected it (' + (bad.status || 'network error') + '): ' + (bad.error || '') });
      else if (!sc.lastRun) lines.push({ state: 'fail', text: 'The scheduler has never run, so nothing was sent. Scheduled functions only run on the published production deploy.' });
      else if (sc.ageSeconds > 180) lines.push({ state: 'fail', text: 'The scheduler stopped running ' + Math.round(sc.ageSeconds / 60) + ' minutes ago.' });
      else if (!((d.subscription && d.subscription.ids) || []).includes(t.id)) lines.push({ state: 'fail', text: 'The server never received this test reminder, so it was never scheduled.' });
      else lines.push({ state: 'fail', text: 'The scheduler is running and had the reminder, but didn\u2019t send it. Check Netlify \u2192 Logs \u2192 Functions \u2192 send-reminder.' });
    } else if (backend) lines.push({ state: 'fail', text: backendErrorText(backend.res, null) });
    const swd = await readSwDiag();
    if (swd && swd.pushAt && new Date(swd.pushAt) >= new Date(t.startedAtISO)) lines.push({ state: swd.shownError ? 'fail' : 'ok', text: swd.shownError ? 'This device received the push but the system refused to display it: ' + swd.shownError : 'This device received the push at ' + fmtClock(swd.pushAt) + ' and displayed it.' });
    else lines.push({ state: 'fail', text: 'This device\u2019s service worker hasn\u2019t received any push since the test started.' });
    const logged = waterEntries.filter(w => new Date(w.time) >= new Date(t.startedAtISO)).length;
    lines.push({ state: logged ? 'warn' : 'ok', text: logged ? logged + ' water entr' + (logged === 1 ? 'y was' : 'ies were') + ' added during the test.' : 'No water was logged automatically.' });
    t.lines = lines; t.phase = 'done'; clearTestMarker();
    await deleteReminder(t.id);     // the temporary reminder is removed (and cancelled on the server)
    rerenderReminders();
  }
  function onPushReceived(msg) {
    if (diag.test && diag.test.phase === 'waiting' && msg && msg.tag === diag.test.id) setTimeout(() => { if (diag.test) { diag.test.targetISO = new Date(Date.now() - 46000).toISOString(); } checkWaterTest(); }, 2500);
    else rerenderReminders();
  }
  function resumeWaterTest() {
    const m = readTestMarker();
    if (!m || diag.test) return;
    diag.test = { ...m, phase: 'waiting', lines: [] };
    if (Date.now() >= new Date(m.targetISO).getTime() + 45000) checkWaterTest();
    else setTimeout(() => { checkWaterTest(); }, new Date(m.targetISO).getTime() + 70000 - Date.now());
  }
  function cleanupTempReminders() {
    const stale = reminders.filter(r => r.temp && !(diag.test && diag.test.id === r.id && diag.test.phase !== 'done') && new Date(r.date + 'T' + r.time + ':00').getTime() + 10 * 60000 < Date.now());

  const sleepMs = ms => new Promise(r => setTimeout(r, ms));
  async function withRetry(fn) {
    for (let attempt = 0; ; attempt++) {
      try { return await fn(); }
      catch (e) {
        const code = e && e.code;
        if ((code === 'resource_exhausted' || code === 'unavailable') && attempt < 4) { await sleepMs(300 + Math.random() * 400 * (attempt + 1)); continue; }
        throw e;
      }
    }
  }
  // Deletes every document in a collection (not just the windowed copy held in memory), a few at a time.
  async function deleteWholeCollection(name, onProgress) {
    let total = 0;
    for (let pass = 0; pass < 30; pass++) {
      const snap = await withRetry(() => cols[name].limit(500).get());
      const docs = snap.docs;
      if (!docs.length) break;
      for (let i = 0; i < docs.length; i += 8) {
        const chunk = docs.slice(i, i + 8);
        await Promise.all(chunk.map(d => withRetry(() => cols[name].doc(d.id).delete())));
        total += chunk.length;
        if (onProgress) onProgress(total);
      }
    }
    return total;
  }

  // mode 'logs': everything you've logged. mode 'all': also profile, goals, supplement list, saved foods, custom symptoms, reminders.
  async function clearData(mode, onProgress) {
    const logCollections = ['logs', 'foodEntries', 'waterEntries', 'supplementLogs', 'cycleEntries', 'symptomLogs', 'healthMeasurements'];
    weightLogs = []; foodEntries = []; waterEntries = []; supplementLogs = []; cycleEntries = []; symptomLogs = []; healthMeasurements = [];
    icebergToast = null; periodNotice = null;
    if (mode === 'all') {
      myFoods = []; customSymptomDefs = []; reminders = [];
      profile = { name: '', age: null, heightCm: null, weightUnit: 'kg' };
      goals = { calories: 1800, protein: 100, fiber: 30, water: 2.0 };
      supplements = defaultSupplements();
      try { localStorage.removeItem('notifPrefs_v1'); } catch (e) {}
    }
    if (localMode) {
      saveLocal();
    } else {
      const names = mode === 'all' ? [...logCollections, 'foods'] : logCollections;
      let done = 0;
      for (const name of names) {
        const base = done;
        done += await deleteWholeCollection(name, n => { if (onProgress) onProgress('Clearing\u2026 ' + (base + n) + ' items removed'); });
      }
      if (mode === 'all') {
        await Promise.all([
          docSaveSettings('profile', profile), docSaveSettings('goals', goals), docSaveSettings('supplements', { list: supplements }),
          docSaveSettings('customSymptoms', { list: [] }), docSaveSettings('reminders', { list: [] }),
        ]);
      }
      // leave nothing stale in memory even if a listener fired mid-way
      weightLogs = []; foodEntries = []; waterEntries = []; supplementLogs = []; cycleEntries = []; symptomLogs = []; healthMeasurements = [];
      if (mode === 'all') myFoods = [];
    }
    if (mode === 'all') queueSync();
    render();
  }

  function clearDataSheet(ov) {
    if (ov.stage === 'working') {
      return sheetWrap('Clearing\u2026', `<div style="padding:26px 10px;text-align:center;font-size:14px;color:var(--text-muted);">${escapeHtml(ov.progress || 'Clearing your data\u2026')}<div style="font-size:12px;margin-top:8px;">Please keep this open until it finishes.</div></div>`);
    }
    if (ov.stage === 'done') {
      return sheetWrap('All clear', `<div class="form-grid"><div style="font-size:14px;line-height:1.5;">Your data has been cleared. You\u2019re starting fresh \u2014 nothing is logged yet.</div><button class="btn block" id="clDone">Start logging</button></div>`);
    }
    const opt = (val, title, text) => `<label style="display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;"><input type="radio" name="clMode" value="${val}" ${ov.mode === val ? 'checked' : ''} style="width:auto;margin-top:3px;"><span><span style="font-size:14px;font-weight:600;">${title}</span><br><span style="font-size:12px;color:var(--text-muted);line-height:1.5;">${text}</span></span></label>`;
    return sheetWrap('Clear my data', `
      <div class="form-grid">
        ${ov.error ? `<div style="font-size:12.5px;color:var(--alert);">${escapeHtml(ov.error)}</div>` : ''}
        <div style="font-size:13px;color:var(--text-muted);">Start fresh \u2014 choose what to clear:</div>
        ${opt('logs', 'Everything I\u2019ve logged', 'Food, water, weight, supplement check-offs, symptoms, periods and health measurements. Your profile, goals, supplement list, saved foods and reminders stay.')}
        ${opt('all', 'Reset the whole app', 'Also resets your profile, goals, supplement list (back to the defaults), saved foods, custom symptoms and reminders.')}
        <div style="font-size:12px;color:var(--text-faint);">This can\u2019t be undone unless you exported a backup. <span id="clExport" style="color:var(--accent-2);font-weight:600;cursor:pointer;">Export a backup first</span></div>
        <button class="btn danger block" id="clGo">Clear data</button>
        <button class="btn ghost block" id="clCancel">Cancel</button>
      </div>
    `);
  }


  // fab + quick add
  document.getElementById('fabBtn').addEventListener('click', () => { overlay = { type: 'quickadd' }; render(); });

  // Ask the browser not to evict this site's storage under pressure (best effort).
  if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(() => {}); }
  // ---- Service worker registration ----
  // register() is idempotent for the same script + scope (it returns the existing registration), so calling this
  // more than once can never create duplicate workers. It never throws: on failure it records WHY in swInfo/swRegError
  // (shown in the diagnostics) and returns null. It is called at startup, again whenever the diagnostics or the
  // Enable/Reconnect buttons need a registration, so a failed first attempt is retried instead of staying broken.
  const swInfo = { state: 'idle', url: null, scope: null, error: null };
  let swPromise = null, swSettled = false;
  function ensureServiceWorker() {
    if (swPromise) return swPromise;
    const fail = (msg) => { swInfo.state = 'failed'; swInfo.error = msg; swRegError = msg; return null; };
    swPromise = (async () => {
      if (!('serviceWorker' in navigator)) return fail('This browser has no service worker support.');
      if (location.protocol === 'blob:' || location.protocol === 'file:' || location.protocol === 'data:') return fail('Service workers can\u2019t run from a ' + location.protocol + ' page (previews and local files). Use the deployed https:// app.');
      if (window.isSecureContext === false) return fail('Service workers need HTTPS; this page is not a secure context.');
      const url = new URL('sw.js', document.baseURI).href;
      swInfo.url = url; swInfo.state = 'registering'; swInfo.error = null;
      // Preflight: confirm the file is really being served as JavaScript, so a missing file or a redirect rule gives a precise message.
      try {
        const res = await fetch(url, { cache: 'no-store' });
        const ct = (res.headers && res.headers.get && res.headers.get('content-type')) || '';
        if (res.status === 401 || res.status === 403) return fail('The server refused access to ' + url + ' (HTTP ' + res.status + '). If this Netlify site has password protection or visitor access limits turned on, the service worker file can\u2019t be fetched \u2014 turn that off.');
        if (!res.ok) return fail('sw.js was not found at ' + url + ' (HTTP ' + res.status + '). The file is not part of the deployed site: add sw.js at the root of your repository (next to index.html), commit it, and let Netlify redeploy.');
        if (/html/i.test(ct)) return fail('The address ' + url + ' returned a web page instead of JavaScript \u2014 a redirect rule is probably sending every path to index.html.');
      } catch (e) { /* offline or blocked: still try to register, the browser may have it cached */ }
      try {
        const reg = await navigator.serviceWorker.register(url);
        swInfo.scope = reg.scope; swInfo.state = reg.active ? 'active' : reg.waiting ? 'waiting' : 'installing'; swRegError = null;
        return reg;
      } catch (e) { return fail('Registration failed: ' + String((e && e.message) || e)); }
    })();
    swPromise.then(r => { swSettled = true; if (!r) swPromise = null; });   // a failed attempt may be retried later
    return swPromise;
  }
  if ('serviceWorker' in navigator && location.protocol !== 'blob:') {
    if (document.readyState === 'complete') ensureServiceWorker();
    else window.addEventListener('load', () => { ensureServiceWorker(); });
  }

  // ================= BOOT =================
  async function boot() {
    if (!window.claude || typeof window.claude.use !== 'function') { localMode = true; loadLocal(); afterBoot(); return; }
    try { sampleFn = await window.claude.use('sample'); } catch (e) { sampleFn = null; }
    try { db = await window.claude.use('db'); } catch (e) { db = null; }
    if (!db) { localMode = true; loadLocal(); afterBoot(); return; }

    cols = {
      logs: db.collection('logs'),
      foodEntries: db.collection('foodEntries'),
      foods: db.collection('foods'),
      waterEntries: db.collection('waterEntries'),
      supplementLogs: db.collection('supplementLogs'),
      cycleEntries: db.collection('cycleEntries'),
      symptomLogs: db.collection('symptomLogs'),
      healthMeasurements: db.collection('healthMeasurements'),
    };

    db.doc('settings/profile').onSnapshot(s => { if (s.exists) profile = { ...profile, ...s.data() }; render(); });
    db.doc('settings/goals').onSnapshot(s => { if (s.exists) goals = { ...goals, ...s.data() }; render(); });
    db.doc('settings/supplements').onSnapshot(s => {
      if (s.exists && s.data().list && s.data().list.length) { supplements = s.data().list; render(); }
      else if (!s.exists) { supplements = defaultSupplements(); saveSupplements(supplements); }
    });
    db.doc('settings/reminders').onSnapshot(s => {
      if (s.exists && Array.isArray(s.data().list)) { reminders = s.data().list.map(normalizeReminder); render(); }
      else if (!s.exists) { reminders = buildLegacyReminders(); docSaveSettings('reminders', { list: reminders }); render(); }
    });
    db.doc('settings/customSymptoms').onSnapshot(s => { customSymptomDefs = (s.exists && s.data().list) ? s.data().list : []; render(); });

    cols.logs.orderBy('date','desc').limit(120).onSnapshot(q => { weightLogs = q.docs.map(d=>d.data()); render(); });
    cols.foodEntries.orderBy('date','desc').limit(400).onSnapshot(q => { foodEntries = q.docs.map(d=>d.data()); render(); });
    cols.foods.limit(100).onSnapshot(q => { myFoods = q.docs.map(d=>d.data()); render(); }, () => {});
    cols.waterEntries.orderBy('date','desc').limit(300).onSnapshot(q => { waterEntries = q.docs.map(d=>d.data()); render(); });
    cols.supplementLogs.orderBy('date','desc').limit(400).onSnapshot(q => { supplementLogs = q.docs.map(d=>d.data()); render(); });
    let cycleMigrationStarted = false;
    cols.cycleEntries.limit(300).onSnapshot(q => {
      const m = migrateCycleEntries(q.docs.map(d => d.data()));
      cycleEntries = m.records;
      render();
      if (m.changed && !cycleMigrationStarted) {
        cycleMigrationStarted = true;
        (async () => {
          for (const id of m.legacyIds) { try { await cols.cycleEntries.doc(id).delete(); } catch (e) {} }
          for (const r of m.records) { await docSave('cycleEntries', r.id, r); }
        })();
      }
    });
    cols.symptomLogs.orderBy('date','desc').limit(400).onSnapshot(q => { symptomLogs = q.docs.map(d=>d.data()); render(); });
    cols.healthMeasurements.orderBy('date','desc').limit(120).onSnapshot(q => { healthMeasurements = q.docs.map(d=>d.data()); render(); });

    render();
    afterBoot();
  }

  boot();
})();
</script>
</body>
</html>
